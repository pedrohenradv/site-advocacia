name: Atualizar notícias do site

on:
  schedule:
    - cron: "17 9 * * *"   # todos os dias às 6h17 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar notícias
        run: python3 scripts/atualizar_noticias.py
      - name: Publicar se houver mudança
        run: |
          git config user.name "atualizador-noticias"
          git config user.email "actions@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Notícias atualizadas em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          # Tenta até 5 vezes: falhas momentâneas do GitHub não derrubam a atualização.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Publicado na tentativa $tentativa."; exit 0
            fi
            echo "Falha na tentativa $tentativa; nova tentativa em $((tentativa * 20))s."
            sleep $((tentativa * 20))
          done
          echo "Não foi possível publicar após 5 tentativas."; exit 1
